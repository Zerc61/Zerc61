<svg xmlns="http://www.w3.org/2000/svg" width="720" height="252" viewBox="0 0 720 252" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif">
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .s1 { animation: spin 7s linear infinite; }
    .s2 { animation: spin 11s linear infinite reverse; }
    .s3 { animation: spin 16s linear infinite; }
    @keyframes ping { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 3s ease-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    .tw1 { animation: tw 2.6s ease-in-out infinite; }
    .tw2 { animation: tw 2s ease-in-out .5s infinite; }
    .tw3 { animation: tw 3s ease-in-out 1s infinite; }
    .tw4 { animation: tw 2.2s ease-in-out 1.4s infinite; }
  </style>

  <rect width="720" height="252" rx="10" fill="#0d1117" stroke="#30363d"/>
  <circle cx="120" cy="40" r="2" fill="#79c0ff" class="tw1"/>
  <circle cx="620" cy="52" r="2" fill="#7ee787" class="tw2"/>
  <circle cx="180" cy="212" r="2" fill="#d2a8ff" class="tw3"/>
  <circle cx="580" cy="200" r="2" fill="#79c0ff" class="tw4"/>

  <g fill="none" stroke="#30363d" stroke-dasharray="4 6">
    <ellipse cx="360" cy="118" rx="96" ry="32"/>
    <ellipse cx="360" cy="118" rx="160" ry="54"/>
    <ellipse cx="360" cy="118" rx="228" ry="78"/>
  </g>

  <circle cx="360" cy="118" r="30" fill="none" stroke="#58a6ff" stroke-width="2" class="ping"/>
  <circle cx="360" cy="118" r="30" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="360" y="123" text-anchor="middle" font-size="13" fill="#e6edf3" font-family="'IBM Plex Mono',monospace">Backend</text>

  <g transform="translate(360,118) scale(1,0.33)">
    <g class="s1"><circle cx="96" cy="0" r="8" fill="#7ee787"/></g>
  </g>
  <g transform="translate(360,118) scale(1,0.33)">
    <g class="s2"><circle cx="160" cy="0" r="9" fill="#79c0ff"/></g>
  </g>
  <g transform="translate(360,118) scale(1,0.33)">
    <g class="s3">
      <circle cx="228" cy="0" r="10" fill="#d2a8ff"/>
      <circle cx="228" cy="0" r="16" fill="none" stroke="#8b949e" stroke-width="1.5"/>
    </g>
  </g>

  <text x="360" y="240" text-anchor="middle" font-size="12" fill="#8b949e" font-family="'IBM Plex Mono',monospace">REST API · PostgreSQL · JWT · Vue.js</text>
</svg>