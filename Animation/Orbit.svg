<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" preserveAspectRatio="xMidYMid meet">
  <rect width="800" height="220" fill="#0D1117"/>
  <defs>
    <linearGradient id="orbitCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD369"/>
      <stop offset="100%" stop-color="#FF6B81"/>
    </linearGradient>
  </defs>
  <circle cx="70" cy="50" r="2" fill="#FFFFFF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="740" cy="70" r="2" fill="#FFD369"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="130" cy="170" r="1.5" fill="#90D4FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="690" cy="180" r="1.5" fill="#C77DFF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="1.4s" repeatCount="indefinite"/></circle>

  <g fill="none" stroke="#30363D" stroke-dasharray="5 7">
    <ellipse cx="400" cy="105" rx="90" ry="32"/>
    <ellipse cx="400" cy="105" rx="150" ry="54"/>
    <ellipse cx="400" cy="105" rx="210" ry="76"/>
  </g>

  <circle cx="400" cy="105" r="24" fill="none" stroke="#FFD369" stroke-width="2">
    <animate attributeName="r" values="24;44" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="105" r="24" fill="url(#orbitCore)"/>

  <g transform="translate(400,105) scale(1,0.36)">
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <circle cx="90" cy="0" r="8" fill="#FF9AA2"/></g>
  </g>
  <g transform="translate(400,105) scale(1,0.36)">
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
      <circle cx="150" cy="0" r="9" fill="#C77DFF"/></g>
  </g>
  <g transform="translate(400,105) scale(1,0.36)">
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
      <circle cx="210" cy="0" r="10" fill="#90D4FF"/>
      <ellipse cx="210" cy="0" rx="18" ry="6" fill="none" stroke="#FFD369" stroke-width="2" transform="rotate(-15 210 0)"/>
    </g>
  </g>

  <text x="400" y="208" text-anchor="middle" font-family="monospace" font-size="12" fill="#656D76">🛰️ orbiting around new ideas</text>
</svg>
