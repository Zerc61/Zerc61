<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif">
  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes type { from { width: 0px; } }
    .t1 { animation: type .9s steps(8, end) infinite; }
    .t2 { animation: type 3s steps(32, end) .9s infinite; }
    .t3 { animation: type 2.1s steps(20, end) 1.2s infinite; }
    .t4 { animation: type 4s steps(39, end) 1.4s infinite; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .fade { animation: fade .4s ease 2.4s both; }
  </style>

  <rect width="680" height="200" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="678" height="34" rx="9" fill="#161b22" stroke="#30363d"/>
  <rect x="1" y="18" width="678" height="17" fill="#161b22"/>
  <circle cx="21" cy="18" r="6" fill="#FF5F57"/>
  <circle cx="39" cy="18" r="6" fill="#FEBC2E"/>
  <circle cx="57" cy="18" r="6" fill="#28C840"/>
  <text x="340" y="22" text-anchor="middle" font-size="11" fill="#8b949e" font-family="'IBM Plex Mono',monospace">anjar@zerc: ~/about.md</text>

  <clipPath id="l1"><rect x="18" y="50" width="66" height="20" class="t1"/></clipPath>
  <text x="18" y="66" clip-path="url(#l1)" font-family="'IBM Plex Mono',monospace" font-size="12.5" fill="#e6edf3">$ whoami</text>

  <clipPath id="l2"><rect x="18" y="76" width="252" height="20" class="t2"/></clipPath>
  <text x="18" y="92" clip-path="url(#l2)" font-family="'IBM Plex Mono',monospace" font-size="12.5" fill="#8b949e">anjar — backend &amp; web developer</text>

  <clipPath id="l3"><rect x="18" y="102" width="150" height="20" class="t3"/></clipPath>
  <text x="18" y="118" clip-path="url(#l3)" font-family="'IBM Plex Mono',monospace" font-size="12.5" fill="#e6edf3">$ cat interests.txt</text>

  <clipPath id="l4"><rect x="18" y="128" width="292" height="20" class="t4"/></clipPath>
  <text x="18" y="144" clip-path="url(#l4)" font-family="'IBM Plex Mono',monospace" font-size="12.5" fill="#8b949e">REST API · PostgreSQL · JWT · Laravel</text>

  <text x="18" y="172" font-family="'IBM Plex Mono',monospace" font-size="12.5" fill="#e6edf3" class="fade">anjar@zerc: ~ $ <tspan fill="#58a6ff" class="blink">▍</tspan></text>
</svg>