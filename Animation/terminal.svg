<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 195" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Terminal: git push origin main — deployed successfully" font-family="'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Menlo,Consolas,monospace">
  <title>zerc — shipping in real time</title>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#141B26"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </radialGradient>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#A371F7"/>
      <stop offset="100%" stop-color="#F778BA"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161D27"/>
      <stop offset="100%" stop-color="#10161E"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232B37"/>
      <stop offset="100%" stop-color="#1B222C"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7D8590"/>
      <stop offset="42%" stop-color="#7D8590"/>
      <stop offset="50%" stop-color="#E6EDF3"/>
      <stop offset="58%" stop-color="#7D8590"/>
      <stop offset="100%" stop-color="#7D8590"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.6"/>
    </pattern>
    <clipPath id="winClip"><rect x="95" y="12" width="610" height="158" rx="14"/></clipPath>
    <clipPath id="typeClip">
      <rect x="132" y="68" width="160" height="20">
        <animate attributeName="width" calcMode="discrete" dur="9s" repeatCount="indefinite"
          values="0;8;16;24;32;40;48;56;64;72;80;88;96;104;112;120;128;136;144;152;160;160"
          keyTimes="0;0.03;0.04;0.05;0.06;0.07;0.08;0.09;0.1;0.11;0.12;0.13;0.14;0.15;0.16;0.17;0.18;0.19;0.2;0.21;0.22;1"/>
      </rect>
    </clipPath>
    <filter id="glowText" x="-15%" y="-150%" width="130%" height="400%">
      <feGaussianBlur stdDeviation="2.5" result="b">
        <animate attributeName="stdDeviation" values="2;4;2" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== background ===== -->
  <rect width="800" height="195" fill="url(#bgGlow)"/>
  <circle cx="150" cy="48" r="120" fill="url(#blobA)"/>
  <circle cx="660" cy="160" r="130" fill="url(#blobB)"/>

  <g fill="#58A6FF">
    <circle cx="42" cy="120" r="1.6" opacity="0.4">
      <animate attributeName="cy" values="200;-8" dur="9s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="60" r="1.2" fill="#A371F7" opacity="0.4">
      <animate attributeName="cy" values="200;-8" dur="12s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="746" cy="140" r="1.6" fill="#A371F7" opacity="0.4">
      <animate attributeName="cy" values="200;-8" dur="10.5s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="772" cy="45" r="1.2" opacity="0.4">
      <animate attributeName="cy" values="200;-8" dur="13s" begin="-9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="3.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="72" y="34" width="656" height="160" rx="30" fill="url(#shadowGrad)"/>

  <!-- ===== terminal window ===== -->
  <g>
    <rect x="95" y="12" width="610" height="158" rx="14" fill="url(#bodyGrad)" stroke="#2D333B" stroke-width="1"/>
    <g clip-path="url(#winClip)">
      <rect x="95" y="12" width="610" height="36" fill="url(#headerGrad)"/>
      <rect x="95" y="46.5" width="610" height="1.5" fill="#0A0E13"/>
      <rect x="95" y="12" width="610" height="3" fill="url(#accent)"/>
    </g>

    <circle cx="122" cy="30" r="6" fill="#FF5F57"/>
    <circle cx="142" cy="30" r="6" fill="#FEBC2E"/>
    <circle cx="162" cy="30" r="6" fill="#28C840"/>
    <text x="400" y="34" text-anchor="middle" font-size="11.5" fill="#8B949E" letter-spacing="0.4">zerc@dev: ~/portfolio</text>

    <rect x="630" y="22" width="60" height="16" rx="8" fill="#1B222C" stroke="#30363D" stroke-width="0.75"/>
    <circle cx="640" cy="30" r="3" fill="#3FB950"/>
    <text x="649" y="33.5" font-size="10" fill="#7EE787">main</text>

    <!-- ===== terminal content ===== -->
    <g>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.012;0.94;1" dur="9s" repeatCount="indefinite"/>

      <text x="114" y="82" font-size="13" font-weight="700" fill="#3FB950">$</text>
      <g clip-path="url(#typeClip)">
        <text x="132" y="82" font-size="13" fill="#E6EDF3"><tspan fill="#FF7B72">git</tspan><tspan fill="#79C0FF"> push</tspan><tspan fill="#FFA657"> origin</tspan><tspan fill="#7EE787"> main</tspan><animate attributeName="opacity" values="1;1;0.8;0.8" keyTimes="0;0.24;0.3;1" dur="9s" repeatCount="indefinite"/></text>
      </g>

      <g>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.27;1" dur="9s" repeatCount="indefinite"/>
        <rect x="292" y="70" width="8" height="16" rx="1.5" fill="#7EE787">
          <animate attributeName="x" calcMode="discrete" dur="9s" repeatCount="indefinite"
            values="132;140;148;156;164;172;180;188;196;204;212;220;228;236;244;252;260;268;276;284;292;292"
            keyTimes="0;0.03;0.04;0.05;0.06;0.07;0.08;0.09;0.1;0.11;0.12;0.13;0.14;0.15;0.16;0.17;0.18;0.19;0.2;0.21;0.22;1"/>
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.499;0.5;1" dur="0.9s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- step 1 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.29;0.42;0.44;1" dur="9s" repeatCount="indefinite"/>
        <circle cx="121" cy="99" r="5.5" fill="none" stroke="#58A6FF" stroke-width="2" stroke-dasharray="9 6" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 121 99" to="360 121 99" dur="0.85s" repeatCount="indefinite"/>
        </circle>
        <text x="133" y="104" font-size="13" fill="#8B949E">compressing objects…</text>
        <rect x="330" y="95" width="140" height="9" rx="4.5" fill="#20262F"/>
        <rect x="330" y="95" width="0" height="9" rx="4.5" fill="url(#barGrad)">
          <animate attributeName="width" values="0;0;140;140" keyTimes="0;0.27;0.42;1" dur="9s" repeatCount="indefinite"/>
        </rect>
        <circle cx="330" cy="99.5" r="3.2" fill="#A5D6FF" opacity="0.9">
          <animate attributeName="cx" values="330;330;470;470" keyTimes="0;0.27;0.42;1" dur="9s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.44;1" dur="9s" repeatCount="indefinite"/>
        <text x="117" y="104" font-size="13" font-weight="700" fill="#3FB950">✓</text>
        <text x="133" y="104" font-size="13" fill="#8B949E">compressed 12 objects</text>
      </g>

      <!-- step 2 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.48;0.58;0.6;1" dur="9s" repeatCount="indefinite"/>
        <circle cx="121" cy="121" r="5.5" fill="none" stroke="#58A6FF" stroke-width="2" stroke-dasharray="9 6" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 121 121" to="360 121 121" dur="0.85s" repeatCount="indefinite"/>
        </circle>
        <text x="133" y="126" font-size="13" fill="#8B949E">optimizing assets…</text>
        <rect x="330" y="117" width="140" height="9" rx="4.5" fill="#20262F"/>
        <rect x="330" y="117" width="0" height="9" rx="4.5" fill="url(#barGrad)">
          <animate attributeName="width" values="0;0;140;140" keyTimes="0;0.46;0.58;1" dur="9s" repeatCount="indefinite"/>
        </rect>
        <circle cx="330" cy="121.5" r="3.2" fill="#A5D6FF" opacity="0.9">
          <animate attributeName="cx" values="330;330;470;470" keyTimes="0;0.46;0.58;1" dur="9s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.6;1" dur="9s" repeatCount="indefinite"/>
        <text x="117" y="126" font-size="13" font-weight="700" fill="#3FB950">✓</text>
        <text x="133" y="126" font-size="13" fill="#8B949E">assets optimized · 148 KB</text>
      </g>

      <!-- step 3 + success -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.64;0.74;0.76;1" dur="9s" repeatCount="indefinite"/>
        <circle cx="121" cy="143" r="5.5" fill="none" stroke="#58A6FF" stroke-width="2" stroke-dasharray="9 6" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 121 143" to="360 121 143" dur="0.85s" repeatCount="indefinite"/>
        </circle>
        <text x="133" y="148" font-size="13" fill="#8B949E">deploying to edge…</text>
        <rect x="330" y="139" width="140" height="9" rx="4.5" fill="#20262F"/>
        <rect x="330" y="139" width="0" height="9" rx="4.5" fill="url(#barGrad)">
          <animate attributeName="width" values="0;0;140;140" keyTimes="0;0.62;0.74;1" dur="9s" repeatCount="indefinite"/>
        </rect>
        <circle cx="330" cy="143.5" r="3.2" fill="#A5D6FF" opacity="0.9">
          <animate attributeName="cx" values="330;330;470;470" keyTimes="0;0.62;0.74;1" dur="9s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g opacity="1" filter="url(#glowText)">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.77;1" dur="9s" repeatCount="indefinite"/>
        <text x="117" y="148" font-size="13" font-weight="700" fill="#3FB950">✓</text>
        <text x="133" y="148" font-size="13"><tspan fill="#7EE787">deployed successfully</tspan><tspan fill="#6E7681"> · </tspan><tspan fill="#FFA657">2.3s</tspan><tspan fill="#6E7681"> → </tspan><tspan fill="#58A6FF">zerc.dev</tspan></text>
      </g>
    </g>

    <rect x="96" y="49" width="608" height="120" fill="url(#scan)" opacity="0.09" clip-path="url(#winClip)"/>
  </g>

  <text x="400" y="187" text-anchor="middle" font-size="12" fill="url(#capGrad)" letter-spacing="0.5">💻 shipping in real time</text>
</svg>
