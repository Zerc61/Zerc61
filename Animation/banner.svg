<svg xmlns="http://www.w3.org/2000/svg" width="620" height="132" viewBox="0 0 620 132" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif">
  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 2.6s ease-out infinite; }
    @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
    .dot1 { animation: pop .35s ease both; }
    .dot2 { animation: pop .35s ease .12s both; }
    .dot3 { animation: pop .35s ease .24s both; }
  </style>

  <rect width="620" height="132" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="618" height="32" rx="9" fill="#161b22" stroke="#30363d"/>
  <rect x="1" y="17" width="618" height="16" fill="#161b22"/>
  <circle cx="21" cy="17" r="6" fill="#FF5F57" class="dot1"/>
  <circle cx="39" cy="17" r="6" fill="#FEBC2E" class="dot2"/>
  <circle cx="57" cy="17" r="6" fill="#28C840" class="dot3"/>
  <text x="310" y="21" text-anchor="middle" font-size="10.5" fill="#8b949e" font-family="'IBM Plex Mono',monospace">anjar@zerc: ~/profile</text>

  <text x="20" y="64" font-size="19" fill="#e6edf3" font-family="'IBM Plex Mono',monospace" font-weight="700">Anjar Wicaksono</text>
  <text x="20" y="92" font-size="12.5" fill="#8b949e" font-family="'IBM Plex Mono',monospace">Backend &amp; Web Developer · Software Engineering Student<tspan fill="#58a6ff" class="blink">▍</tspan></text>
  <text x="20" y="112" font-size="11" fill="#6e7781" font-family="'IBM Plex Mono',monospace">SMK Bahrul Ulum Surabaya — Rekayasa Perangkat Lunak (RPL)</text>

  <rect x="20" y="120" width="580" height="3" rx="1.5" fill="#30363d"/>
  <rect x="20" y="120" width="580" height="3" rx="1.5" fill="#58a6ff" class="grow"/>
</svg>