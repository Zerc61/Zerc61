<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-label="Anjar Wicaksono — Backend &amp; Web Developer" font-family="'JetBrains Mono','IBM Plex Mono','Fira Code','SF Mono',Consolas,Menlo,monospace">
  <title>Anjar Wicaksono — Backend &amp; Web Developer</title>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect width="760" height="260" rx="12"/></clipPath>
    <clipPath id="cName"><rect x="24" y="96" width="330" height="44" class="type-name"/></clipPath>
    <clipPath id="cDesc"><rect x="24" y="168" width="232" height="24" class="type-desc"/></clipPath>
  </defs>

  <style>
    /* satu timeline sinkron: 10 detik */
    .scene { animation: scene 10s linear infinite; }
    @keyframes scene { 0% { opacity: 0; } 2% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }

    .o1 { animation: o1 10s ease infinite; }
    @keyframes o1 { 0%, 2% { opacity: 0; } 4%, 100% { opacity: 1; } }

    /* ketik: Anjar Wicaksono */
    .type-name { animation: tName 10s steps(1, end) infinite; }
    @keyframes tName {
      0%, 4% { width: 0; }
      5% { width: 21px; } 6% { width: 42px; } 7% { width: 63px; } 8% { width: 84px; }
      9% { width: 105px; } 10% { width: 126px; } 11% { width: 147px; } 12% { width: 168px; }
      13% { width: 189px; } 14% { width: 210px; } 15% { width: 231px; } 16% { width: 252px; }
      17% { width: 273px; } 18% { width: 294px; } 19%, 100% { width: 330px; }
    }
    .g-name { animation: gName 10s steps(1, end) infinite; }
    @keyframes gName { 0%, 4% { opacity: 0; } 5%, 19% { opacity: 1; } 20%, 100% { opacity: 0; } }
    .curs-name { animation: curN 10s steps(1, end) infinite, blink 1.1s steps(1) infinite; }
    @keyframes curN {
      0%, 4% { transform: translateX(0); }
      5% { transform: translateX(21px); } 6% { transform: translateX(42px); }
      7% { transform: translateX(63px); } 8% { transform: translateX(84px); }
      9% { transform: translateX(105px); } 10% { transform: translateX(126px); }
      11% { transform: translateX(147px); } 12% { transform: translateX(168px); }
      13% { transform: translateX(189px); } 14% { transform: translateX(210px); }
      15% { transform: translateX(231px); } 16% { transform: translateX(252px); }
      17% { transform: translateX(273px); } 18% { transform: translateX(294px); }
      19% { transform: translateX(315px); }
    }

    .o2 { animation: o2 10s ease infinite; }
    @keyframes o2 { 0%, 21% { opacity: 0; } 23%, 100% { opacity: 1; } }

    /* ketik: Backend & Web Developer */
    .type-desc { animation: tDesc 10s steps(1, end) infinite; }
    @keyframes tDesc {
      0%, 23% { width: 0; }
      24% { width: 9.6px; } 25% { width: 19.2px; } 26% { width: 28.8px; } 27% { width: 38.4px; }
      28% { width: 48px; } 29% { width: 57.6px; } 30% { width: 67.2px; } 31% { width: 76.8px; }
      32% { width: 86.4px; } 33% { width: 96px; } 34% { width: 105.6px; } 35% { width: 115.2px; }
      36% { width: 124.8px; } 37% { width: 134.4px; } 38% { width: 144px; } 39% { width: 153.6px; }
      40% { width: 163.2px; } 41% { width: 172.8px; } 42% { width: 182.4px; } 43% { width: 192px; }
      44% { width: 201.6px; } 45% { width: 211.2px; } 46%, 100% { width: 232px; }
    }
    .g-desc { animation: gDesc 10s steps(1, end) infinite; }
    @keyframes gDesc { 0%, 23% { opacity: 0; } 24%, 100% { opacity: 1; } }
    .curs-desc { animation: curD 10s steps(1, end) infinite, blink 1.1s steps(1) infinite; }
    @keyframes curD {
      0%, 23% { transform: translateX(0); }
      24% { transform: translateX(9.6px); } 25% { transform: translateX(19.2px); }
      26% { transform: translateX(28.8px); } 27% { transform: translateX(38.4px); }
      28% { transform: translateX(48px); } 29% { transform: translateX(57.6px); }
      30% { transform: translateX(67.2px); } 31% { transform: translateX(76.8px); }
      32% { transform: translateX(86.4px); } 33% { transform: translateX(96px); }
      34% { transform: translateX(105.6px); } 35% { transform: translateX(115.2px); }
      36% { transform: translateX(124.8px); } 37% { transform: translateX(134.4px); }
      38% { transform: translateX(144px); } 39% { transform: translateX(153.6px); }
      40% { transform: translateX(163.2px); } 41% { transform: translateX(172.8px); }
      42% { transform: translateX(182.4px); } 43% { transform: translateX(192px); }
      44% { transform: translateX(201.6px); } 45% { transform: translateX(211.2px); }
      46% { transform: translateX(220.8px); }
    }

    /* nama "bernapas" */
    .name { animation: nameGlow 3.5s ease-in-out 5s infinite; }
    @keyframes nameGlow {
      0%, 100% { filter: drop-shadow(0 0 1px rgba(88, 166, 255, 0)); }
      50% { filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.35)); }
    }

    /* progress bar tumbuh seiring sesi */
    .grow {
      transform-box: fill-box; transform-origin: left center;
      filter: drop-shadow(0 0 4px rgba(88, 166, 255, 0.45));
      animation: grow 10s ease-in-out infinite;
    }
    @keyframes grow { 0%, 4% { transform: scaleX(0); } 46%, 100% { transform: scaleX(1); } }

    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .dot { transform-box: fill-box; transform-origin: center; }
    .d1 { animation: pop .35s ease both; }
    .d2 { animation: pop .35s ease .12s both; }
    .d3 { animation: pop .35s ease .24s both; }
    @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) {
      .scene, .o1, .type-name, .g-name, .curs-name, .o2, .type-desc, .g-desc, .curs-desc,
      .name, .grow, .d1, .d2, .d3 { animation: none; }
    }
  </style>

  <!-- kartu: hitam polos, tanpa border -->
  <rect width="760" height="260" rx="12" fill="#000000"/>
  <g clip-path="url(#card)">
    <rect width="760" height="40" fill="#161b22"/>
    <rect y="39.5" width="760" height="1" fill="#0a0e13"/>
    <rect width="760" height="2.5" fill="url(#accent)"/>
  </g>

  <!-- title bar -->
  <circle cx="24" cy="20" r="6" fill="#FF5F57" class="dot d1"/>
  <circle cx="44" cy="20" r="6" fill="#FEBC2E" class="dot d2"/>
  <circle cx="64" cy="20" r="6" fill="#28C840" class="dot d3"/>
  <text x="380" y="24" text-anchor="middle" font-size="11.5" fill="#8b949e" letter-spacing="0.3">anjar@zerc: ~/profile</text>
  <g>
    <rect x="686" y="12.5" width="50" height="15" rx="7.5" fill="#1b222c"/>
    <circle cx="697" cy="20" r="2.8" fill="#3fb950"/>
    <text x="705" y="23.5" font-size="10" fill="#7ee787">zsh</text>
  </g>

  <!-- isi terminal -->
  <g class="scene" fill="#e6edf3" font-size="13">
    <text x="24" y="76" class="o1"><tspan fill="#3fb950">anjar@zerc</tspan><tspan fill="#6e7681">: </tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#6e7681"> $ </tspan><tspan fill="#e6edf3">whoami</tspan></text>

    <text x="24" y="124" font-size="35" font-weight="700" class="name" clip-path="url(#cName)">Anjar Wicaksono</text>
    <g class="g-name" opacity="0">
      <rect x="24" y="101" width="21" height="27" rx="2" fill="#58a6ff" class="curs-name"/>
    </g>

    <text x="24" y="158" class="o2"><tspan fill="#3fb950">anjar@zerc</tspan><tspan fill="#6e7681">: </tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#6e7681"> $ </tspan><tspan fill="#e6edf3">cat about.txt</tspan></text>

    <text x="24" y="186" font-size="16" fill="#79c0ff" clip-path="url(#cDesc)">Backend &amp; Web Developer</text>
    <g class="g-desc" opacity="0">
      <rect x="24" y="172" width="10" height="17" rx="1.5" fill="#58a6ff" class="curs-desc"/>
    </g>

    <rect x="24" y="224" width="712" height="4" rx="2" fill="#21262d"/>
    <rect x="24" y="224" width="712" height="4" rx="2" fill="#58a6ff" class="grow"/>
  </g>

  <!-- scanline CRT samar -->
  <g clip-path="url(#card)">
    <rect y="41" width="760" height="219" fill="url(#scan)" opacity="0.06"/>
  </g>
</svg>
