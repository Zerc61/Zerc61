<svg xmlns="http://www.w3.org/2000/svg" width="620" height="170" viewBox="0 0 620 170" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif">
  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes type { from { width: 0px; } }
    .type-name { animation: type 2.6s steps(15, end) infinite; }
    .type-desc { animation: type 3.2s steps(23, end) .6s infinite; }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(192px); } }
    .curs-name { animation: travel 2.6s steps(15, end) infinite, blink 1.1s steps(1) infinite; }
    @keyframes travelD { from { transform: translateX(0); } to { transform: translateX(170px); } }
    .curs-desc { animation: travelD 3.2s steps(23, end) .6s infinite, blink 1.1s steps(1) infinite; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .fade1 { animation: fade .5s ease both; }
    .fade2 { animation: fade .5s ease .9s both; }
    @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
    .d1 { animation: pop .35s ease both; }
    .d2 { animation: pop .35s ease .12s both; }
    .d3 { animation: pop .35s ease .24s both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 2.6s ease-out infinite; }
  </style>

  <rect width="620" height="170" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="618" height="32" rx="9" fill="#161b22" stroke="#30363d"/>
  <rect x="1" y="17" width="618" height="16" fill="#161b22"/>
  <circle cx="21" cy="17" r="6" fill="#FF5F57" class="d1"/>
  <circle cx="39" cy="17" r="6" fill="#FEBC2E" class="d2"/>
  <circle cx="57" cy="17" r="6" fill="#28C840" class="d3"/>
  <text x="310" y="21" text-anchor="middle" font-size="10.5" fill="#8b949e" font-family="'IBM Plex Mono',monospace">anjar@zerc: ~/profile</text>

  <text x="18" y="54" font-size="12" fill="#8b949e" font-family="'IBM Plex Mono',monospace" class="fade1">anjar@zerc: ~ $ whoami</text>

  <clipPath id="cName"><rect x="18" y="64" width="197" height="30" class="type-name"/></clipPath>
  <text x="18" y="87" clip-path="url(#cName)" font-size="21" fill="#e6edf3" font-family="'IBM Plex Mono',monospace" font-weight="700">Anjar Wicaksono</text>
  <rect x="18" y="72" width="12" height="17" fill="#58a6ff" class="curs-name"/>

  <text x="18" y="112" font-size="12" fill="#8b949e" font-family="'IBM Plex Mono',monospace" class="fade2">anjar@zerc: ~ $ cat about.txt</text>

  <clipPath id="cDesc"><rect x="18" y="116" width="172" height="22" class="type-desc"/></clipPath>
  <text x="18" y="134" clip-path="url(#cDesc)" font-size="12.5" fill="#8b949e" font-family="'IBM Plex Mono',monospace">Backend &amp; Web Developer</text>
  <rect x="18" y="122" width="11" height="15" fill="#58a6ff" class="curs-desc"/>

  <rect x="18" y="156" width="584" height="3" rx="1.5" fill="#30363d"/>
  <rect x="18" y="156" width="584" height="3" rx="1.5" fill="#58a6ff" class="grow"/>
</svg>