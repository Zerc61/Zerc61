<!-- Flowing River Animation -->
<div align="center">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" preserveAspectRatio="xMidYMid meet">
  <rect width="800" height="220" fill="#0D1117"/>
  <defs>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90D4FF"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>
  </defs>

  <!-- Stars -->
  <g fill="#FFD369">
    <circle cx="60" cy="30" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="55" r="1.5" fill="#FFFFFF"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="25" r="2" fill="#FFFFFF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="45" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="20" r="2" fill="#FFFFFF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Moon -->
  <circle cx="670" cy="48" r="30" fill="#FFD369" opacity="0.15"/>
  <circle cx="670" cy="48" r="20" fill="#FFD369"/>
  <circle cx="663" cy="42" r="4" fill="#E5B369" opacity="0.5"/>
  <circle cx="676" cy="55" r="3" fill="#E5B369" opacity="0.5"/>

  <!-- Wave layers (parallax) -->
  <path fill="#90D4FF" opacity="0.16" d="M0,100 Q50,88 100,100 T200,100 T300,100 T400,100 T500,100 T600,100 T700,100 T800,100 T900,100 T1000,100 L1000,220 L0,220 Z">
    <animateTransform attributeName="transform" type="translate" values="0,0; -200,0" dur="11s" repeatCount="indefinite"/>
  </path>
  <path fill="#C77DFF" opacity="0.2" d="M0,116 Q50,102 100,116 T200,116 T300,116 T400,116 T500,116 T600,116 T700,116 T800,116 T900,116 T1000,116 L1000,220 L0,220 Z">
    <animateTransform attributeName="transform" type="translate" values="0,0; -200,0" dur="8s" repeatCount="indefinite"/>
  </path>
  <path fill="#95E1D3" opacity="0.28" d="M0,132 Q50,116 100,132 T200,132 T300,132 T400,132 T500,132 T600,132 T700,132 T800,132 T900,132 T1000,132 L1000,220 L0,220 Z">
    <animateTransform attributeName="transform" type="translate" values="0,0; -200,0" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Paper boat -->
  <g>
    <animateMotion dur="18s" repeatCount="indefinite"
      path="M-60,134 C 60,124 160,144 300,134 C 440,124 540,144 680,134 C 770,130 850,134 900,136"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="2.4s" repeatCount="indefinite"/>
      <polygon points="-20,4 20,4 12,13 -12,13" fill="#FF9AA2"/>
      <polygon points="-3,2 -3,-16 15,2" fill="#FFFFFF"/>
      <polygon points="-6,2 -6,-11 -18,2" fill="#FFE9EC"/>
    </g>
  </g>

  <!-- Front wave -->
  <path fill="url(#waterGrad)" opacity="0.92" d="M0,150 Q50,135 100,150 T200,150 T300,150 T400,150 T500,150 T600,150 T700,150 T800,150 T900,150 T1000,150 L1000,220 L0,220 Z">
    <animateTransform attributeName="transform" type="translate" values="0,0; -200,0" dur="4.5s" repeatCount="indefinite"/>
  </path>
  <path fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3" d="M0,150 Q50,135 100,150 T200,150 T300,150 T400,150 T500,150 T600,150 T700,150 T800,150 T900,150 T1000,150">
    <animateTransform attributeName="transform" type="translate" values="0,0; -200,0" dur="4.5s" repeatCount="indefinite"/>
  </path>

  <!-- Moon reflection -->
  <ellipse cx="670" cy="170" rx="24" ry="4" fill="#FFD369" opacity="0.15">
    <animate attributeName="opacity" values="0.08;0.3;0.08" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="662;678;662" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Surface sparkles -->
  <rect x="170" y="144" width="12" height="2" rx="1" fill="#FFFFFF"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.2s" repeatCount="indefinite"/></rect>
  <rect x="390" y="141" width="12" height="2" rx="1" fill="#FFFFFF"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="1.8s" begin="0.5s" repeatCount="indefinite"/></rect>
  <rect x="600" y="145" width="12" height="2" rx="1" fill="#FFFFFF"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.6s" begin="1s" repeatCount="indefinite"/></rect>

  <!-- Bubbles -->
  <g fill="#E6F7FF">
    <circle cx="140" cy="205" r="3"><animate attributeName="cy" values="208;162" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.25;1" dur="4s" repeatCount="indefinite"/><animate attributeName="cx" values="140;146;136;140" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="205" r="2"><animate attributeName="cy" values="208;165" dur="3.2s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.25;1" dur="3.2s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="cx" values="230;224;234;230" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="205" r="3.5"><animate attributeName="cy" values="208;160" dur="4.6s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.25;1" dur="4.6s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="cx" values="330;337;325;330" dur="4.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="205" r="2"><animate attributeName="cy" values="208;164" dur="3.6s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.25;1" dur="3.6s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="cx" values="430;424;435;430" dur="3.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="205" r="3"><animate attributeName="cy" values="208;161" dur="4.2s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.25;1" dur="4.2s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="cx" values="530;536;526;530" dur="4.2s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="205" r="2.5"><animate attributeName="cy" values="208;163" dur="3.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.65;0" keyTimes="0;0.25;1" dur="3.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="cx" values="630;624;635;630" dur="3.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="205" r="2"><animate attributeName="cy" values="208;166" dur="3.8s" begin="1.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.25;1" dur="3.8s" begin="1.9s" repeatCount="indefinite"/><animate attributeName="cx" values="710;716;706;710" dur="3.8s" begin="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <text x="400" y="212" text-anchor="middle" font-family="monospace" font-size="12" fill="#656D76">🌊 river.exe — endless flow, like my commit streak</text>
</svg>
</div>
