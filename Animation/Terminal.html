<!-- Typing Terminal -->
<div align="center">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 195" width="100%" preserveAspectRatio="xMidYMid meet">
  <rect width="800" height="195" fill="#0D1117"/>
  <defs>
    <clipPath id="termType">
      <rect x="134" y="66" width="0" height="22">
        <animate attributeName="width" values="0;0;162;162" keyTimes="0;0.02;0.22;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <rect x="100" y="18" width="600" height="132" rx="12" fill="#161B22" stroke="#30363D"/>
  <rect x="100" y="18" width="600" height="34" rx="12" fill="#21262D"/>
  <rect x="100" y="40" width="600" height="12" fill="#21262D"/>
  <circle cx="126" cy="35" r="5.5" fill="#FF6B81"/>
  <circle cx="146" cy="35" r="5.5" fill="#FFD369"/>
  <circle cx="166" cy="35" r="5.5" fill="#95E1D3"/>
  <text x="400" y="40" text-anchor="middle" font-family="monospace" font-size="11" fill="#8B949E">zerc@dev: ~/portfolio</text>

  <text x="118" y="82" font-family="monospace" font-size="13" fill="#FFD369">$</text>
  <text x="136" y="82" font-family="monospace" font-size="13" fill="#E6EDF3" clip-path="url(#termType)">git push origin main</text>
  <rect x="134" y="70" width="8" height="15" fill="#95E1D3">
    <animate attributeName="x" values="134;134;296;296" keyTimes="0;0.02;0.22;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.28;0.94;1" dur="8s" repeatCount="indefinite"/>
    <circle cx="143" cy="102" r="5" fill="none" stroke="#90D4FF" stroke-width="2" stroke-dasharray="9 6">
      <animateTransform attributeName="transform" type="rotate" from="0 143 102" to="360 143 102" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="158" y="107" font-family="monospace" font-size="12" fill="#8B949E">compressing objects...</text>
    <rect x="318" y="96" width="120" height="9" rx="4.5" fill="#30363D"/>
    <rect x="318" y="96" width="0" height="9" rx="4.5" fill="#90D4FF">
      <animate attributeName="width" values="0;0;120;120" keyTimes="0;0.28;0.6;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="118" y="132" font-family="monospace" font-size="13" fill="#95E1D3" opacity="0">✔ deployed successfully — 2.3s
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.66;0.94;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <text x="400" y="178" text-anchor="middle" font-family="monospace" font-size="12" fill="#656D76">💻 shipping in real time</text>
</svg>
</div>
