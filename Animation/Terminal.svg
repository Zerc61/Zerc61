<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200" role="img" aria-label="Terminal: whoami — anjar, backend &amp; web developer" font-family="'JetBrains Mono','IBM Plex Mono','Fira Code','SF Mono',Consolas,Menlo,monospace">
  <title>anjar — backend &amp; web developer</title>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect width="680" height="200" rx="10"/></clipPath>
    <clipPath id="l1"><rect x="18" y="50" width="68" height="20" class="t1"/></clipPath>
    <clipPath id="l3"><rect x="18" y="102" width="156" height="20" class="t3"/></clipPath>
  </defs>

  <style>
    .scene { animation: scene 9s linear infinite; }
    @keyframes scene { 0% { opacity: 0; } 2% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }

    .t1 { animation: t1 9s steps(1, end) infinite; }
    @keyframes t1 {
      0%, 4% { width: 0; }
      5% { width: 8px; } 6% { width: 16px; } 7% { width: 24px; } 8% { width: 32px; }
      9% { width: 40px; } 10% { width: 48px; } 11% { width: 56px; } 12%, 100% { width: 68px; }
    }
    .c1 { animation: c1 9s steps(1, end) infinite; }
    @keyframes c1 {
      0%, 4% { transform: translateX(0); opacity: 1; }
      5% { transform: translateX(8px); } 6% { transform: translateX(16px); }
      7% { transform: translateX(24px); } 8% { transform: translateX(32px); }
      9% { transform: translateX(40px); } 10% { transform: translateX(48px); }
      11% { transform: translateX(56px); } 12% { transform: translateX(64px); }
      13%, 100% { opacity: 0; }
    }

    .o1 { animation: o1 9s ease infinite; }
    @keyframes o1 { 0%, 14% { opacity: 0; } 16%, 100% { opacity: 1; } }

    .t3 { animation: t3 9s steps(1, end) infinite; }
    @keyframes t3 {
      0%, 20% { width: 0; }
      21% { width: 8px; } 22% { width: 16px; } 23% { width: 24px; } 24% { width: 32px; }
      25% { width: 40px; } 26% { width: 48px; } 27% { width: 56px; } 28% { width: 64px; }
      29% { width: 72px; } 30% { width: 80px; } 31% { width: 88px; } 32% { width: 96px; }
      33% { width: 104px; } 34% { width: 112px; } 35% { width: 120px; } 36% { width: 128px; }
      37% { width: 136px; } 38% { width: 144px; } 39%, 100% { width: 156px; }
    }
    .c3 { animation: c3 9s steps(1, end) infinite; }
    @keyframes c3 {
      0%, 19% { opacity: 0; }
      20% { opacity: 1; transform: translateX(0); }
      21% { transform: translateX(8px); } 22% { transform: translateX(16px); }
      23% { transform: translateX(24px); } 24% { transform: translateX(32px); }
      25% { transform: translateX(40px); } 26% { transform: translateX(48px); }
      27% { transform: translateX(56px); } 28% { transform: translateX(64px); }
      29% { transform: translateX(72px); } 30% { transform: translateX(80px); }
      31% { transform: translateX(88px); } 32% { transform: translateX(96px); }
      33% { transform: translateX(104px); } 34% { transform: translateX(112px); }
      35% { transform: translateX(120px); } 36% { transform: translateX(128px); }
      37% { transform: translateX(136px); } 38% { transform: translateX(144px); }
      39% { transform: translateX(152px); }
      40%, 100% { opacity: 0; }
    }

    .techs { animation: o2 9s ease infinite, techGlow 3s ease-in-out 5s infinite; }
    @keyframes o2 { 0%, 41% { opacity: 0; } 43%, 100% { opacity: 1; } }
    @keyframes techGlow {
      0%, 100% { filter: drop-shadow(0 0 1px rgba(88, 166, 255, 0)); }
      50% { filter: drop-shadow(0 0 6px rgba(88, 166, 255, 0.4)); }
    }

    .prompt { animation: o3 9s ease infinite; }
    @keyframes o3 { 0%, 45% { opacity: 0; } 47%, 100% { opacity: 1; } }

    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .scene, .t1, .c1, .t3, .c3, .o1, .techs, .prompt, .blink { animation: none; }
    }
  </style>

  <!-- kartu: hitam polos, tanpa border -->
  <rect width="680" height="200" rx="10" fill="#000000"/>
  <g clip-path="url(#card)">
    <rect width="680" height="34" fill="#161b22"/>
    <rect y="33.5" width="680" height="1" fill="#0a0e13"/>
    <rect width="680" height="2.5" fill="url(#accent)"/>
  </g>

  <!-- title bar -->
  <circle cx="21" cy="17" r="6" fill="#FF5F57"/>
  <circle cx="39" cy="17" r="6" fill="#FEBC2E"/>
  <circle cx="57" cy="17" r="6" fill="#28C840"/>
  <text x="340" y="21" text-anchor="middle" font-size="11" fill="#8b949e" letter-spacing="0.3">anjar@zerc: ~/about.md</text>
  <g>
    <rect x="610" y="10" width="46" height="14" rx="7" fill="#1b222c"/>
    <circle cx="620" cy="17" r="2.6" fill="#3fb950"/>
    <text x="628" y="20.5" font-size="9.5" fill="#7ee787">zsh</text>
  </g>

  <!-- isi terminal -->
  <g class="scene" fill="#e6edf3" font-size="12.5">
    <text x="18" y="66" clip-path="url(#l1)"><tspan fill="#3fb950">$</tspan> whoami</text>
    <rect x="18" y="55" width="8" height="14" rx="1.5" fill="#7ee787" opacity="0" class="c1"/>

    <text x="18" y="92" class="o1"><tspan fill="#79c0ff">anjar</tspan><tspan fill="#484f58"> — </tspan><tspan fill="#8b949e">backend &amp; web developer</tspan></text>

    <text x="18" y="118" clip-path="url(#l3)"><tspan fill="#3fb950">$</tspan> cat interests.txt</text>
    <rect x="18" y="107" width="8" height="14" rx="1.5" fill="#7ee787" opacity="0" class="c3"/>

    <text x="18" y="144" class="techs"><tspan fill="#79c0ff">REST API</tspan><tspan fill="#3d444d"> · </tspan><tspan fill="#7ee787">PostgreSQL</tspan><tspan fill="#3d444d"> · </tspan><tspan fill="#ffa657">JWT</tspan><tspan fill="#3d444d"> · </tspan><tspan fill="#ff7b72">Laravel</tspan></text>

    <text x="18" y="172" class="prompt"><tspan fill="#3fb950">anjar@zerc</tspan><tspan fill="#6e7681">: </tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#6e7681"> $ </tspan><tspan fill="#7ee787" class="blink">▍</tspan></text>
  </g>

  <!-- scanline CRT samar -->
  <g clip-path="url(#card)">
    <rect y="36" width="680" height="164" fill="url(#scan)" opacity="0.07"/>
  </g>
</svg>
